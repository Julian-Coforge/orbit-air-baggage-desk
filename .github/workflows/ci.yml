# STRETCH GOAL 3: run pytest and ruff on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: |
          set +e
          pytest
          rc=$?
          # 5 means no tests collected yet, which is expected before the first branch.
          if [ "$rc" -eq 5 ]; then exit 0; fi
          exit "$rc"

  docker:
    # STRETCH GOAL 4 check: build the image, then run the tests and the app inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t orbit-air .
      - name: Run tests in the container
        run: docker run --rm --entrypoint pytest orbit-air -q
      - name: Run the app in the container
        # One container, so report reads the database that seed just wrote.
        run: |
          docker run --rm --entrypoint sh orbit-air -c '
            python main.py --now 2026-11-02T09:00:00 seed seed_claims.csv &&
            python main.py --now 2026-11-02T14:01:00 report'
